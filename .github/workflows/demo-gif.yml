# Keeps the README images (demo.gif, compare.gif, social-preview.png) up to date with the latest Docker / compose / buildx / WSL
# versions. Runs weekly; commits only when a version changed.
name: Update README images

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch:            # "Run workflow" button
  push:
    branches: [main]
    paths:
      - assets/make-demo-gif.py
      - install.ps1

permissions:
  contents: write

concurrency:
  group: demo-gif
  cancel-in-progress: false

jobs:
  render:
    runs-on: windows-latest     # has Segoe UI, used for the window title bar
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "pillow>=11,<14"

      - name: Render GIF
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python assets/make-demo-gif.py

      - name: Commit if something changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && git diff --quiet -- assets/demo-versions.json; then
            echo "No new versions, nothing to do."
            exit 0
          fi
          if [ -z "$(git status --porcelain -- assets/)" ]; then
            echo "GIF unchanged."
            exit 0
          fi
          summary=$(python -c "import json; v=json.load(open('assets/demo-versions.json')); print(f\"Docker {v['docker']}, compose {v['compose']}, buildx {v['buildx']}, WSL {v['wsl']}\")")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo.gif assets/compare.gif assets/social-preview.png assets/logo/lindowin-wordmark.png assets/logo/lindowin-wordmark-dark.png assets/logo/lindowin-banner.png assets/logo/lindowin-banner-dark.png assets/demo-versions.json
          git commit -m "Update README images ($summary)"
          git push
